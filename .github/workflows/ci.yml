name: CI & Birim Testleri

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Birim Testleri Calistir (pytest)
        run: |
          pytest -v --durations=10

      - name: Konfigurasyon Dosyalari Dogrulamasi
        run: |
          python3 -c "
          import yaml, json, glob
          for yf in glob.glob('config/*.yaml'):
              yaml.safe_load(open(yf))
          for jf in glob.glob('config/*.json'):
              json.load(open(jf))
          print('Tum konfigurasyon dosyalari gecerli!')
          "
