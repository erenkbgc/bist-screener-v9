name: BIST gunluk tarama

# Spec: delivery.schedule = 18:30 Europe/Istanbul. Turkiye yaz saati
# uygulamadigi icin (2016'dan beri sabit UTC+3) bu her zaman 15:30 UTC'dir.
# GitHub Actions'in zamanlanmis cron'lari yogun saatlerde birkac dakika
# gecikebilir (GitHub'in belgelenmis bir sinirlamasi) -- bu normaldir.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:  # Actions sekmesinden manuel calistirma/test icin
    inputs:
      universe_limit:
        description: "Test icin evreni ilk N tickerla sinirla (bos = tam ~800 hisse, production)"
        required: false
        default: ""
      tickers:
        description: "Test edilecek hisseler (virgulle ayrilmis, orn: FORTE,THYAO,ASELS) - bos = tam evren"
        required: false
        default: ""
      force:
        description: "Idempotency kontrolunu atla (true = zorla yeniden calistir)"
        required: false
        default: "false"

# Ayni anda iki kosunun ayni SQLite dosyasina yazip cakismasini engeller.
concurrency:
  group: bist-daily-screener
  cancel-in-progress: false

permissions:
  contents: write  # data/bist_history.db + data/reports/ geri commit'lemek icin

jobs:
  run-screener:
    runs-on: ubuntu-latest
    # Olcum: ~9sn/ticker (ag) + DB yazma/skorlama; ~800 tickerlik tam evren
    # sirali halde ~8 saat surer (GitHub Actions'in 360dk/6sa sert sinirini
    # asar). core/live_data.py::PREFETCH_MAX_WORKERS ile sinirli paralellik
    # bunu kisaltir ama saglayicilar (Is Yatirim/TradingView/doviz.com)
    # concurrency arttikca throttle ediyor -- kesin sure ancak gercek bir
    # tam kosu ile netlesir. 350dk (platform sinirinin hemen alti) guvenlik
    # payi olarak ayarlandi; repo public oldugu icin dakika kotasi sorun degil.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Istanbul tarihini hesapla
        id: today
        run: echo "date=$(TZ=Europe/Istanbul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Tarama calistir (BIST_DATA_MODE=live)
        env:
          BIST_DATA_MODE: live
          BIST_LIVE_UNIVERSE_LIMIT: ${{ inputs.universe_limit }}
          BIST_LIVE_TICKERS: ${{ inputs.tickers }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python run.py --as-of-date ${{ steps.today.outputs.date }} $EXTRA_ARGS

      - name: HTML raporu ve payload'i is ciktisi olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bist-report-${{ steps.today.outputs.date }}
          path: data/reports/
          retention-days: 90

      - name: Veritabani + raporlari repoya geri commit'le
        if: always()
        # Kosu saatler surdugu icin origin/master bu arada lokalden ilerlemis
        # olabilir (bkz. 2026-09-15: "! [rejected] master -> master (fetch
        # first)" -- gunun tum DB/rapor guncellemesi hic remote'a gitmeden
        # kayboldu). git add/commit sadece data/bist_history.db ve
        # data/reports/ dokunuyor, insan commit'leri neredeyse hep baska
        # dosyalara dokunuyor; fetch+rebase ile birkac deneme bu cakismayi
        # guvenle cozer.
        run: |
          git config user.name "bist-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bist_history.db data/reports/ config/weights_optimized.json
          if git diff --cached --quiet; then
            echo "commit edilecek degisiklik yok"
            exit 0
          fi
          git commit -m "chore: ${{ steps.today.outputs.date }} tarama sonuclari"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push reddedildi (deneme $attempt/5), origin/master ile rebase deneniyor"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "rebase basarisiz, cakisma var -- manuel mudahale gerekiyor"
              exit 1
            fi
          done
          echo "5 denemeden sonra push basarisiz oldu"
          exit 1
