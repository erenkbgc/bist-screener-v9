# final_score agirliklari ve esikleri.
# priors_are_disclosed (execution_rules): bu katsayilar ve esik degerleri
# hicbir gecmis veriyle kalibre edilmemis, DENENMEMIS BASLANGIC VARSAYIMLARIDIR.
# Degistirmek isteyen biri bu dosyayi manuel duzenlemelidir; kod hicbir zaman
# bu degerleri kendi basina ogrenmez/degistirmez.

scoring_weights:
  valuation_z: 0.50
  catalyst_score: 0.25
  ownership_quality_z: 0.15
  # low_vol_z (2026-09-16 eklendi): BIST literaturunde gozlenen "dusuk risk
  # anomalisi"ne (dusuk volatiliteli hisselerin risk-ayarli olarak yuksek
  # volatiliteli hisseleri gecmesi) dayanan bir baslangic varsayimi. Diger
  # ucu gibi HENUZ bu projenin kendi outcomes verisiyle kalibre edilmedi;
  # en kucuk agirlikla (yeni/dogrulanmamis) baslatildi, digerlerinden
  # oransal olarak dusuldu (valuation 0.55->0.50, catalyst 0.30->0.25).
  low_vol_z: 0.10

piotroski:
  normalized_score_threshold: 0.55  # 9 kriterin normalize edilmis skorunda gecme esigi

top_n_per_bucket: 4

# Degerleme Ucgeni (Valuation Triangle) bilesen agirliklari (v13 roadmap P0-3).
# priors_are_disclosed: bu agirliklar akademik ve kurumsal degerleme
# pratiklerine dayanan baslangic varsayimidir.
valuation_triangle_weights:
  dcf: 0.40
  peer_multiples: 0.35
  quality_premium: 0.25

# Rejim-Duyarli Dinamik Faktor Agirliklari (Quant Level-Up Faz 1)
# Piyasa rejimine gore faktörlerin agirlik dagilimi (Asness et al., AQR 2017).
regime_scoring_weights:
  STRONG_BULL:
    valuation_z: 0.35
    catalyst_score: 0.35
    ownership_quality_z: 0.15
    low_vol_z: 0.15
  MILD_BULL:
    valuation_z: 0.45
    catalyst_score: 0.25
    ownership_quality_z: 0.15
    low_vol_z: 0.15
  CORRECTION_CHOPPY:
    valuation_z: 0.45
    catalyst_score: 0.15
    ownership_quality_z: 0.25
    low_vol_z: 0.15
  OVERSOLD_REVERSAL:
    valuation_z: 0.55
    catalyst_score: 0.15
    ownership_quality_z: 0.20
    low_vol_z: 0.10
  STRONG_BEAR:
    valuation_z: 0.35
    catalyst_score: 0.10
    ownership_quality_z: 0.30
    low_vol_z: 0.25


