# final_score agirliklari ve esikleri.
# priors_are_disclosed (execution_rules): bu katsayilar ve esik degerleri
# hicbir gecmis veriyle kalibre edilmemis, DENENMEMIS BASLANGIC VARSAYIMLARIDIR.
# Degistirmek isteyen biri bu dosyayi manuel duzenlemelidir; kod hicbir zaman
# bu degerleri kendi basina ogrenmez/degistirmez.

scoring_weights:
  # 2026-10-10 Faz 2 on-kaydi (docs/research/long_term_preregistration.md):
  # taban deger portfoyu (value_sn: E/P, B/M, S/P, EBIT/EV, sektor ici) ust
  # dilimi net aktif +10.65%/yil (t 2.71) kesif 2013-2020, +6.96%/yil (t 2.60)
  # holdout 2021-2026. Hicbir ek filtre/bilesim (sikinti, cokus, momentum,
  # 52 haftalik zirve, GP/A, SUE) gecme esigini gecmedi; on-kayda gore skor
  # duz value_sn'dir.
  #   - catalyst/ownership: gecmis veri yok, test edilemez -> 0 (yalnizca bilgi).
  #   - low_vol: deger + dusuk-vol vekili (t 2.66) duz degerden (t 4.05) zayif -> 0.
  #   - momentum 12-1: etkisiz (t 0.71) -> 0.
  # Onceki karisim (0.50/0.25/0.15/0.10) test edilmemis varsayimdi.
  valuation_z: 1.00
  catalyst_score: 0.00
  ownership_quality_z: 0.00
  low_vol_z: 0.00
  momentum_z: 0.00

piotroski:
  normalized_score_threshold: 0.55  # STRONG_OPPORTUNITY kademesi icin kalite esigi
  # Sert filtre (hard_filters) esigi. Piotroski (2000) ayrimi: F 8-9 yuksek,
  # 0-3 dusuk, orta bant notr. 0.55 sert filtre olarak medyan firmayi eliyordu
  # (evrenin ~%20'si yalnizca bu kapidan dustu; ornek THYAO 4/8=0.50). Nominal
  # (TMS 29 disi) beslemede kriter 3/5/6/8 enflasyonla bozuldugu icin orta bant
  # sinyali zayif. Sert kapi yalnizca dusuk kaliteyi (<=3/9 esdegeri) eler.
  hard_filter_min_score: 0.34

# Uzun vade hedefi: beklenen = (P + alpha * (adil deger - P)) * (1 + k_e)^(180/365) - temettu
# (core/targets.py::compute_long_term_target). alpha = 180 gunde kapanan acik orani.
# 2026-09-27 kesitsel test (scripts/backtest_target_accuracy.py; emsal bacagi PIT
# panelde yeniden kuruldu, 468 hisse, 2013-2026): gozlenen alpha 0.031 (t 2.5);
# 2016-2020 0.053, 2021-2026 0.018. Onceki deger 0.32 (weights_optimized.json,
# tek XU100 serisi) en ucuz dilimde +25% goreli getiri vaat ediyordu; gerceklesen +1.4%.
# 0.05 = alt donem tahminlerinin ust ucu (muhafazakar). DCF ve kalite bacaklari,
# ML senaryo agirliklandirmasi bu testte YOK (bkz. script docstring).
target_convergence_alpha: 0.05

# Kisa vade kovasi fırsat olarak sunulmaz (false): canli kural (hacim >= 1.5 +
# deger skoru) gecmis veride evrenin gerisinde/basabas (scripts/backtest_short_term.py)
# ve on-kayitli 6 aday sinyalden hicbiri gecme kuralini saglamadi
# (docs/research/short_term_preregistration.md, 2026-09-28). false iken kisa vade
# adaylari en fazla WATCHLIST olur ve bultende "deneysel" notuyla gosterilir.
# true yapmak icin yeni bir on-kayitli testin gecmesi gerekir.
short_term_opportunities_enabled: false

top_n_per_bucket: 4

# Degerleme Ucgeni (Valuation Triangle) bilesen agirliklari (v13 roadmap P0-3).
# priors_are_disclosed: bu agirliklar akademik ve kurumsal degerleme
# pratiklerine dayanan baslangic varsayimidir.
# 2026-09-27: dcf 0.40 -> 0.25, peer 0.35 -> 0.50. Kanit: hedef fiyat
# isabeti calismalarinda carpan/hibrit yontemler tek basina DCF'den daha
# isabetli (Hindistan sell-side 2024; Varsova borsasi karsilastirmali yontem).
# Ayrica bu projedeki DCF nominal TL FCF ve ~%45 WACC ile calisir; terminal
# deger varsayimlarina asiri duyarlidir. weights_optimized.json'daki
# "optimize" ucgen agirliklari GERCEK bacak ciktilariyla degil, tek XU100
# serisinden teknik vekillerle (SMA uzakligi, RSI) uretildigi icin
# KULLANILMAZ (use_optimized_weights kapali).
valuation_triangle_weights:
  dcf: 0.25
  peer_multiples: 0.50
  quality_premium: 0.25

# Rejim agirliklari kaldirildi (2026-10-10). Faz 2 on-kaydi H6: rejim motoru
# nokta-zamanli yeniden kurulamiyor ve makro calisma (macro_drivers_preregistration.md)
# piyasa yonunu ongorebilen bir degisken bulamadi. Karar: sabit agirlik.
# get_regime_weights rejim verilse de scoring_weights'i dondurur.


